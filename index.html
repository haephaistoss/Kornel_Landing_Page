<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Palyazz – pályázat menedzsment. Az új oldal fejlesztés alatt áll, hamarosan jövünk.">
    <title>Palyazz | Hamarosan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-start: #667eea;
            --bg-end: #764ba2;
            --accent: #06b6d4;
            --text: #ffffff;
            --text-soft: rgba(255, 255, 255, 0.8);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            background-color: var(--bg-end);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            min-height: 100vh;
        }
        .card {
            width: 100%;
            max-width: 560px;
            text-align: center;
            padding: clamp(2rem, 6vw, 3.5rem) clamp(1.5rem, 5vw, 3rem);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.15);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 2rem;
        }
        h1 {
            font-size: clamp(1.6rem, 5vw, 2.25rem);
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1rem;
        }
        p {
            color: var(--text-soft);
            font-size: 1.05rem;
            line-height: 1.6;
        }
        .dots { display: inline-flex; gap: 8px; margin-top: 2rem; }
        .dots span {
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--text);
            opacity: 0.4;
            animation: pulse 1.4s ease-in-out infinite;
        }
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); background: var(--accent); }
        }
        @media (prefers-reduced-motion: reduce) {
            .dots span { animation: none; opacity: 0.7; }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="logo">Palyazz</div>
        <h1>Az új oldal fejlesztés alatt áll</h1>
        <p>Hamarosan jövünk! Addig is köszönjük a türelmét.</p>
        <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </main>
</body>
</html>
